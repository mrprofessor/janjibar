[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mrprofessor/janjibar"
publish = false

[workspace.dependencies]
# Internal crates.
model = { path = "crates/model" }
engine = { path = "crates/engine" }
bridge = { path = "crates/bridge" }
ui = { path = "crates/ui" }
helm = { path = "crates/helm" }

# GPUI. Pin exactly: gpui-kit re-exports gpui-pre =0.3.11 and enables
# runtime_shaders and font-kit on the platform crate for us.
gpui-kit = "=0.9.0"

# Kubernetes.
kube = { version = "5.0.0", features = ["runtime"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }

# Async and plumbing.
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"

# Helm release payloads: base64 of gzip of JSON. Same base64 major as kube.
base64 = "0.23"
flate2 = "1"
# YAML. kube 5 uses it too. serde_yml and serde_yaml are banned in deny.toml.
serde-saphyr = "2.1"
# Instants. k8s-openapi and kube already use jiff; crates that convert to
# local time add the `tz-system` and `tzdb-zoneinfo` features.
jiff = { version = "0.2.41", default-features = false, features = ["std"] }

# Tests.
tempfile = "3"


[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
# GPUI code writes `Context<Self>`, not `Context<'_, Self>`.
elided_lifetimes_in_paths = "allow"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# Default groups (correctness, suspicious, style, complexity, perf).
all = { level = "warn", priority = -1 }
# Pedantic, minus the lints that are mostly noise for an app.
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
items_after_statements = "allow"
cast_precision_loss = "allow"
# Restriction lints we opt into.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
mem_forget = "warn"
exit = "warn"

[profile.release]
debug = false
# Cargo strips release builds by default. With this toolchain on macOS 27 the
# stripped proc-macro dylibs fail to load ("mis-aligned LINKEDIT string pool"),
# so keep symbols. script/bundle-mac strips the final binary instead.
strip = false

[profile.dist]
# Shipping builds, made by script/bundle-mac, which strips the binary. Whole
# program LTO with one codegen unit is slow to build, so day-to-day
# measuring stays on `release`.
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
# Dependencies build optimised so the dev app is usable; our code stays fast to rebuild.
opt-level = 2

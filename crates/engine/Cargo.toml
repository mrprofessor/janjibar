[package]
name = "engine"
description = "The tokio side: kubeconfig catalog, clients and watches. Never depends on GPUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
model.workspace = true
kinds.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
# `net` for forward listeners, `io-util` to pipe their connections.
tokio = { workspace = true, features = ["net", "io-util"] }
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
http.workspace = true
jiff = { workspace = true, features = ["tz-system", "tzdb-zoneinfo"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util"] }
tempfile.workspace = true
# The fake port-forward endpoint speaks WebSocket. Same version kube uses.
tokio-tungstenite = "0.30"

[lints]
workspace = true

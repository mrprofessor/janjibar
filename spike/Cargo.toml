[package]
name = "janjibar-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["runtime_shaders", "font-kit"] }
kube = { version = "5.0.0", features = ["runtime"] }
k8s-openapi = { version = "0.29.0", features = ["latest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
anyhow = "1"

# Tests may unwrap, expect, panic and print. Production code may not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Names that read as words in our docs, not as code: products and
# Kubernetes kinds. ".." keeps clippy's defaults.
doc-valid-idents = [
  "PromQL", "OpenShift", "VictoriaMetrics", "JetBrains",
  "ConfigMap", "ConfigMaps", "CronJob", "CronJobs", "DaemonSet", "DaemonSets",
  "ReplicaSet", "ReplicaSets", "StatefulSet", "StatefulSets", "StorageClass",
  "StorageClasses", "PersistentVolume", "PersistentVolumes",
  "PersistentVolumeClaim", "PersistentVolumeClaims", "..",
]

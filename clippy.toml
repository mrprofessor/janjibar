# Tests may unwrap, expect, panic and print. Production code may not.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true

# Product names in prose, not code. ".." keeps clippy's defaults.
doc-valid-idents = ["PromQL", "OpenShift", "VictoriaMetrics", ".."]

# cargo-deny configuration. Run with `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# macOS only until 1.0. Add Linux and Windows targets when those builds start.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[advisories]
# Unmaintained notices only fail for our direct dependencies. GPUI's deep tree
# carries a few we cannot fix from here.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses only. This is the set GPUI, gpui-kit and kube-rs need.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # MPL-2.0 is file-level copyleft. These two arrive through GPUI's tree and
    # we do not modify them: cbindgen is a build tool, option-ext comes via dirs.
    { allow = ["MPL-2.0"], crate = "cbindgen" },
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Unmaintained and has a security advisory. Use serde-saphyr (kube 5 does).
    { crate = "serde_yml", reason = "unsound and unmaintained; use serde-saphyr" },
    { crate = "serde_yaml", reason = "deprecated; use serde-saphyr" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
